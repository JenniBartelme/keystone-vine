<body>

    <header class="site-header">
        <div class="container header-inner">
            <a href="index.html" class="logo">Keystone <span>&amp;</span> Vine</a>
            <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu">&#9776;</button>
            <nav id="siteNav">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="services.html" class="active">Services</a></li>
                    <li><a href="pricing.html">Pricing</a></li>

                </ul>
            </nav>

    <main>
        
<link rel="stylesheet" href="style.css">
<main>
    <section class="page-header">
        <div class="container">
            <h1>Book a Call</h1>
            <p>Tell us about your business and we'll reach out to schedule a call and prepare your quote.</p>
        </div>
    </section>

    <section>
        <div class="container">
            <div class="form-wrap">
                <form action="#" method="post">
                    <div class="form-group">
                        <label for="name">Your Name</label>
                        <input type="text" id="name" name="name" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required>
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone</label>
                        <input type="tel" id="phone" name="phone">
                    </div>

                    <div class="form-group">
                        <label for="company">Business Name</label>
                        <input type="text" id="company" name="company">
                    </div>

                    <div class="form-group">
                        <label for="service">What do you need help with?</label>
                        <select id="service" name="service">
                            <option value="">Choose one...</option>
                            <option>Website creation</option>
                            <option>Website management</option>
                            <option>Restoration and recovery</option>
                            <option>Network architecture</option>
                            <option>IT solutions and software</option>
                            <option>Project management</option>
                            <option>Not sure yet</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="time">Best time for a call</label>
                        <input type="text" id="time" name="time" placeholder="e.g. Weekday mornings">
                    </div>

                    <div class="form-group">
                        <label for="message">Tell us about your project</label>
                        <textarea id="message" name="message"></textarea>
                    </div>

                    <button type="submit" class="btn">Request a Quote</button>
                </form>
            </div>
        </div>
    </section>
    </main>
